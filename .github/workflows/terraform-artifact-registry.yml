name: Terraform Artifact Registry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-artifact-registry.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform-artifact-registry.yml'

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_project_id: sada-seed-2025-sandbox
  TF_VAR_region: us-central1
  TF_VAR_repository_id: sada-docker
  TF_VAR_repository_format: DOCKER

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Authenticate to Google Cloud
        # Required IAM condition should include the GitHub identity used for the OIDC assertion:
        # attribute.actor == "sponnur1"
        # attribute.repository_owner == "sadasystems"
        # attribute.repository == "sadasystems/<your-repo-name>"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform fmt check
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Show plan output
        run: terraform show -no-color tfplan

  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Authenticate to Google Cloud
        # Required IAM condition should include the GitHub identity used for the OIDC assertion:
        # attribute.actor == "sponnur1"
        # attribute.repository_owner == "sadasystems"
        # attribute.repository == "sadasystems/<your-repo-name>"
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
